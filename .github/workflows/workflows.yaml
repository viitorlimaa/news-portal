name: PR Check

on:
  pull_request:
    branches: [develop, main]

jobs:
  check-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Verifica arquivos de banco
        run: |
          if find . -name "*.db" -not -path "./node_modules/*" | grep -q .; then
            echo "❌ Arquivo de banco de dados encontrado!"
            exit 1
          else
            echo "Nenhum arquivo de banco encontrado"
          fi

      - name: Instala dependências
        run: npm ci

      - name: Verifica erros de TypeScript
        run: npm run check

      - name: Executa linter
        run: npm run lint

      - name: Executa testes
        run: npm test -- --runInBand
